<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Set colour theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var t = (q === 'dark' || q === 'light') ? q : localStorage.getItem('theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#0b0c0f' : '#ffffff');
        } catch (e) {}
      })();
    </script>

    <title>Sugyant Chettri - Senior Software Engineer</title>
    <meta
      name="description"
      content="Sugyant Chettri - Senior Software Engineer with 15+ years delivering secure, scalable, cloud-native platforms across banking, insurance and healthcare in New Zealand and Singapore."
    />
    <meta name="author" content="Sugyant Chettri" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sugyant Chettri - Senior Software Engineer" />
    <meta
      property="og:description"
      content="15+ years building Java, Spring Boot & cloud-native microservices across banking, insurance and healthcare."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Hidden static form so Netlify's build-time crawler detects the form
      fields for the React-rendered contact form. Do not remove.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
